name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    # This repo is private, so its GitHub Releases would need a token to
    # download. The install artifacts are published to the *public*
    # vasilirigels/inventory-app-releases repo instead, so the auto-updater on
    # installed PCs can fetch them anonymously. RELEASES_TOKEN is a token with
    # `contents:write` on that public repo (secret set in this repo's settings).
    env:
      RELEASES_REPO: vasilirigels/inventory-app-releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write .env from GitHub secrets
        shell: bash
        run: |
          cat > .env <<EOF
          TURSO_URL=${{ secrets.TURSO_URL }}
          TURSO_TOKEN=${{ secrets.TURSO_TOKEN }}
          EOF

      - name: Build React frontend
        run: npm run build

      - name: Build Windows installer
        # --publish never: we handle publishing below with gh, which is more
        # reliable than letting electron-builder create the release itself.
        run: npx electron-builder --win --publish never

      - name: Publish installer to public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Publishing $TAG to $RELEASES_REPO"
          if gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading with --clobber"
          else
            gh release create "$TAG" \
              --repo "$RELEASES_REPO" \
              --title "$TAG" \
              --notes "Automated build from private inventory-app CI."
          fi
          gh release upload "$TAG" \
            release/AriShop-Setup-*.exe \
            release/AriShop-Setup-*.exe.blockmap \
            release/latest.yml \
            --repo "$RELEASES_REPO" \
            --clobber
