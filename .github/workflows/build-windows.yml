name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write .env from GitHub secrets
        shell: bash
        run: |
          cat > .env <<EOF
          TURSO_URL=${{ secrets.TURSO_URL }}
          TURSO_TOKEN=${{ secrets.TURSO_TOKEN }}
          EOF

      - name: Build React frontend
        run: npm run build

      - name: Build Windows installer
        # --publish never: don't let electron-builder create the release itself.
        # We create it explicitly below (in one API call) and upload assets to
        # avoid the race that produces duplicate/dangling releases.
        run: npx electron-builder --win --publish never

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Creating release for tag $TAG"
          # If a release for this tag already exists (rerun), reuse it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets with --clobber"
          else
            gh release create "$TAG" --title "$TAG" --notes "Automated build from CI."
          fi
          gh release upload "$TAG" \
            release/AriShop-Setup-*.exe \
            release/AriShop-Setup-*.exe.blockmap \
            release/latest.yml \
            --clobber
