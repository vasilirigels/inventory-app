name: Build macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    # Publikohet te i njëjti repo publik si Windows-i (inventory-app-releases)
    # që auto-updater-i i Mac-ut (electron-updater) të mund ta shkarkojë
    # anonimisht nga latest-mac.yml te po ai release.
    env:
      RELEASES_REPO: vasilirigels/inventory-app-releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write .env from GitHub secrets
        run: |
          cat > .env <<EOF
          TURSO_URL=${{ secrets.TURSO_URL }}
          TURSO_TOKEN=${{ secrets.TURSO_TOKEN }}
          EOF

      - name: Install libsql native binaries for both arch-et
        # npm install në macos-latest (arm64) shkarkon vetëm @libsql/darwin-arm64.
        # Për të prodhuar DMG-në x64 me native binary të saktë, shkarkojmë edhe
        # @libsql/darwin-x64 me skript të veçantë (bypass i EBADPLATFORM).
        run: npm run libsql:mac-both

      - name: Build React frontend
        run: npm run build

      - name: Build macOS DMG (x64 + arm64)
        # --publish never: gh upload më poshtë (më i besueshëm se
        # electron-builder që të krijojë release-in vetë).
        # --x64 --arm64 = universal build për Intel dhe Apple Silicon.
        run: npx electron-builder --mac --x64 --arm64 --publish never

      - name: Publish DMG-t te public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Publishing $TAG to $RELEASES_REPO"
          if gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading with --clobber"
          else
            gh release create "$TAG" \
              --repo "$RELEASES_REPO" \
              --title "$TAG" \
              --notes "Automated build from private inventory-app CI."
          fi
          gh release upload "$TAG" \
            release/ChamShop-*.dmg \
            release/ChamShop-*.dmg.blockmap \
            release/latest-mac.yml \
            --repo "$RELEASES_REPO" \
            --clobber
